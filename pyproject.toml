[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "egd-spot-calc"
version = "0.1.0"
description = "Compute what your electricity would have cost on a Czech spot-price tariff, using EG.D (E.ON Distribuce) smart-meter data and OTE day-ahead prices."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "egd-spot-calc contributors" }]
keywords = ["electricity", "spot price", "OTE", "EGD", "E.ON Distribuce", "smart meter", "Czech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.31",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "responses>=0.25",
    "ruff>=0.6",
    "openpyxl>=3.1",
]

[project.scripts]
egd-spot = "egd_spot.cli:main"

[project.urls]
Homepage = "https://github.com/OWNER/egd-spot-calc"
Issues = "https://github.com/OWNER/egd-spot-calc/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/egd_spot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PTH", "RET"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Czech text contains look-alike characters

[tool.ruff.format]
quote-style = "double"
