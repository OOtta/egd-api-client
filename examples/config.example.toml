# egd-api-client configuration example.
# Copy to ~/.config/egd-api-client/config.toml (Linux/macOS) or %APPDATA%\egd-api-client\config.toml
# (Windows) and `chmod 600` it if you store the client secret here.
# Every value can be overridden on the command line; credentials also via the
# environment variables EGD_CLIENT_ID / EGD_CLIENT_SECRET / EGD_EAN.

[egd]
# Generate at https://portal.distribuce24.cz → Správa účtů → "Vzdálený přístup – OpenAPI"
client_id = "your-client-id"
client_secret = "your-client-secret"
ean = "859182400xxxxxxxxx"
# profile = "ICC1"          # consumption profile; default by meter type (ICC1 for A/B, DCQC for C1)
# api_variant = "rest"      # "rest" (unified /rest/spotreby) or "c1-legacy" (/rest/c/spotreby)
# timestamps = "start"      # do API timestamps mark the interval start or end?
# test_env = false          # use test.distribuce24.cz

# ---- `egd spot …` --------------------------------------------------------------
[spot]
# effective energy price = spot × multiplier + add_czk_mwh
multiplier = 1.0
add_czk_mwh = 400           # supplier margin in CZK/MWh (excl. VAT)
# negative_multiplier = 1.0   # used when the spot price is negative (default: multiplier)
# negative_add_czk_mwh = 0    # used when the spot price is negative (default: add_czk_mwh)
monthly_fee = 0             # fixed supplier fee in CZK/month (excl. VAT)
vat = 0                     # VAT in percent; 21 for the Czech standard rate
negative = "as-is"          # "as-is" | "clamp-spot" | "clamp-total"
price_resolution = "auto"   # "auto" (15-min prices from 2025-10-01) | "hourly"

# Optional comparison with a fixed-price product
[spot.fixed]
price_czk_kwh = 3.20        # excl. VAT; the high-tariff (VT) price of a two-rate product
# price_low_czk_kwh = 2.40  # low-tariff (NT) price; needs [low_tariff] below
monthly_fee = 120

# Low-tariff (NT) hours – EG.D's API does not provide them; required for price_low_czk_kwh.
[low_tariff]
# hours = "22:00-06:00,13:00-15:00"        # every day (local time)
# hours_weekend = "00:00-08:00,12:00-20:00" # optional, Saturday and Sunday
# holidays = "weekday"                       # or "sunday": holidays use the weekend hours

# Your distribution charges – nothing is built in; CZK excl. VAT, added to spot and fixed.
[distribution]
# high_czk_kwh = 2.10       # per kWh in VT (all consumption if low_czk_kwh is not set)
# low_czk_kwh = 0.45        # per kWh in NT; needs [low_tariff] hours
# monthly_fee = 300         # circuit breaker etc., CZK/month
